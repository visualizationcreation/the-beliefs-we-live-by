<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">The Beliefs We Live By — a practice map</title><desc id="desc">Notice the event, then Name the prediction, then Look for alternatives, then Test and revise. Original explanatory diagram, not research data.</desc><rect width="1200" height="630" fill="#edf5fa"/><g fill="#193446" font-family="Georgia,serif" font-size="49"><text x="70" y="105">The Beliefs We Live By</text></g><text x="70" y="235" fill="#3c5869" font-family="Arial,sans-serif" font-size="23">A small practice to return to. Follow the points; make it your own.</text><path d="M140 354H1055" stroke="#93b9ad" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="145" cy="354" r="31" fill="#93b9ad"/><circle cx="145" cy="354" r="9" fill="#193446"/><text x="145" y="425" fill="#193446" font-size="22">Notice the event</text><circle cx="442" cy="354" r="31" fill="#93b9ad"/><circle cx="442" cy="354" r="9" fill="#193446"/><text x="442" y="425" fill="#193446" font-size="22">Name the prediction</text><circle cx="739" cy="354" r="31" fill="#93b9ad"/><circle cx="739" cy="354" r="9" fill="#193446"/><text x="739" y="425" fill="#193446" font-size="22">Look for alternatives</text><circle cx="1036" cy="354" r="31" fill="#93b9ad"/><circle cx="1036" cy="354" r="9" fill="#193446"/><text x="1036" y="425" fill="#193446" font-size="22">Test and revise</text></g><path d="M1036 495v25H145v-25" stroke="#7792a2" stroke-width="2" fill="none"/><text x="590" y="554" text-anchor="middle" fill="#3c5869" font-family="Arial,sans-serif" font-size="19">Return, reflect, adjust</text><text x="70" y="600" fill="#3c5869" font-family="Arial,sans-serif" font-size="17">ORBIVERSITY · SELF-DEVELOPMENT</text><text x="1130" y="600" text-anchor="end" fill="#3c5869" font-family="Arial,sans-serif" font-size="17">Original practice map · not research data</text></svg>